services:
  gc-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: washeng-gc-studio:latest
    container_name: washeng-gc-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - .env
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-u495297697_appsheet}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      APP_DOMAIN: gc.cargo.washeng.online
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.75'
    networks:
      - washeng
      - proxy

networks:
  washeng:
    name: washeng-app_washeng
    external: true
  proxy:
    name: proxy
    external: true

